<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live poll on Chaupal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="/"><span class="logo-mark">🪷</span>chaupal</a>
      <div id="auth-slot"></div>
    </header>

    <main id="poll-root">
      <div class="poll-layout">
        <div class="panel"><div class="skeleton" style="height:320px"></div></div>
        <div class="panel"><div class="skeleton" style="height:200px"></div></div>
      </div>
    </main>
  </div>

  <!-- QR code library (draws the QR for "show on projector") -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script type="module" src="/js/poll.js"></script>
</body>
</html>
